version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Static site - no build step required"
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Content-Security-Policy'
        value: "frame-ancestors 'none'"
      - key: 'X-Frame-Options'
        value: 'DENY'
